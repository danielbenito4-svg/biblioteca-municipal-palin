name: Validacion PHP — entrega final

on:
  push:
    branches: [main, entrega-final-2026]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "demo"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: biblioteca_palin
      DB_USERNAME: root
      DB_PASSWORD: demo
    steps:
      - uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, curl
          coverage: none
      - name: Comprobar sintaxis de todos los archivos PHP
        run: |
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Probar modelos y reglas con base temporal MySQL
        run: php tests/integration.php


      - name: Instalar Apache y validar rutas HTTP reales
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2 libapache2-mod-php php-mysql php-mbstring php-curl
          PHP_MOD=$(basename "$(find /etc/apache2/mods-available -name 'php*.load' | head -n 1)" .load)
          sudo a2enmod "$PHP_MOD"
          sudo ln -s "$GITHUB_WORKSPACE" /var/www/html/biblioteca-palin
          printf '<Directory "%s">\nAllowOverride All\nOptions FollowSymLinks\nRequire all granted\n</Directory>\n' "$GITHUB_WORKSPACE" | sudo tee /etc/apache2/conf-available/biblioteca-final.conf
          sudo a2enconf biblioteca-final
          printf "%s\n" "<?php return ['password' => 'demo'];" > config/database.local.php
          chmod -R ugo+rwX storage
          php -r '$c=require "config/database.php"; $p=new PDO("mysql:host=".$c["host"].";port=".$c["port"].";charset=utf8mb4",$c["username"],$c["password"]); $p->exec(file_get_contents("database.sql"));'
          sudo service apache2 restart
          curl -sSi --max-time 10 http://localhost/biblioteca-palin/ | head -n 25
          php tests/http.php || { sudo tail -n 80 /var/log/apache2/error.log; exit 1; }
      - name: Preparar ZIP definitivo de codigo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=biblioteca-palin/ -o dist/ProyectoFinal_2453090_Benito.zip HEAD
          unzip -t dist/ProyectoFinal_2453090_Benito.zip
          unzip -l dist/ProyectoFinal_2453090_Benito.zip | grep -E 'database.sql|README.md'
      - name: Publicar ZIP como artefacto descargable
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ProyectoFinal_2453090_Benito
          path: dist/ProyectoFinal_2453090_Benito.zip
          if-no-files-found: error
      - name: Crear etiqueta Git final solo tras pasar las pruebas
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Entrega Final"
          git config user.email "actions@users.noreply.github.com"
          git tag -a final -m "Entrega y defensa del proyecto final, noviembre 2026" "$GITHUB_SHA"
          git push origin refs/tags/final
